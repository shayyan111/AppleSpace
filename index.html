<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Apple Space — something extraordinary is on its way. Visit us in Rawalpindi.">
<title>Apple Space — Coming Soon</title>
<link rel="icon" href="/applespace-logo.png" type="image/png">
<style>
:root{color-scheme:dark;--bg:#090a0d;--silver:#e7e7ea;--muted:#92939b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--silver);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
.stage{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse 75% 50% at 50% 43%,#1b1d25 0%,#101116 40%,#090a0d 85%)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background:linear-gradient(115deg,transparent 37%,#ffffff15 50%,transparent 63%);transform:translateX(-110%);animation:sweep 2.3s cubic-bezier(.2,.8,.2,1) 1.25s both}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.19;background-image:radial-gradient(#ffffff 0.45px,transparent .65px);background-size:4px 4px;mask-image:radial-gradient(ellipse at center,#0005,transparent 75%)}
.aura{position:absolute;width:min(70vw,780px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#b2b4c022 0%,#6a70731b 21%,transparent 66%);filter:blur(14px);animation:aura 7s ease-in-out infinite;z-index:-1}
.ring{position:absolute;width:min(64vw,650px);aspect-ratio:1;border:1px solid #ffffff10;border-radius:50%;opacity:0;animation:ring-in 2.5s 1.8s forwards}
.ring.two{width:min(86vw,890px);border-color:#ffffff07;animation-delay:2.05s}
.content{position:relative;z-index:2;text-align:center;padding:3rem 1.1rem;max-width:1100px;width:100%}
.logo-wrap{position:relative;width:clamp(140px,24vw,225px);height:clamp(140px,24vw,225px);margin:0 auto 1.35rem;display:grid;place-items:center;opacity:0;filter:blur(18px);transform:scale(.68);animation:logo-reveal 1.65s cubic-bezier(.2,.7,.15,1) .25s forwards}
.logo-wrap img{height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 0 35px #ffffff2a)}
.logo-fallback{display:none;font-size:2.7rem;font-weight:750;letter-spacing:-.08em}
.brand{font-size:clamp(.7rem,1.8vw,.94rem);font-weight:650;letter-spacing:.57em;padding-left:.57em;color:#c6c7ce;opacity:0;animation:fade-up 1s 1.45s forwards}
.divider{height:1px;width:0;margin:1.7rem auto 1.6rem;background:linear-gradient(90deg,transparent,#f2f2f7aa,transparent);animation:line-in 1.3s 1.6s forwards}
.eyebrow{font-size:clamp(.61rem,1.3vw,.75rem);letter-spacing:.34em;padding-left:.34em;color:#9698a1;opacity:0;animation:fade-up .9s 1.92s forwards}
.headline{font-size:clamp(3rem,11vw,8.8rem);line-height:.95;letter-spacing:-.07em;font-weight:720;margin:1.35rem auto .6rem;max-width:1100px;background:linear-gradient(115deg,#898a93 0%,#fff 35%,#e0e1e7 55%,#7d808c 100%);background-clip:text;-webkit-background-clip:text;color:transparent;opacity:0;filter:blur(14px);transform:translateY(42px) scale(.96);animation:headline-in 1.3s cubic-bezier(.16,1,.3,1) 2.27s forwards}
.sub{font-size:clamp(.86rem,2vw,1.1rem);letter-spacing:.01em;color:#9e9fa8;margin:1.65rem auto 2.3rem;opacity:0;animation:fade-up 1s 3.05s forwards}
.actions{display:flex;justify-content:center;gap:.9rem;flex-wrap:wrap;opacity:0;animation:fade-up 1s 3.45s forwards}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.84rem 1.45rem;border-radius:99px;text-decoration:none;font-size:.83rem;font-weight:600;transition:transform .25s,background .25s,border-color .25s}
.btn:hover{transform:translateY(-3px)}.btn.primary{color:#111216;background:#e9e9ec}.btn.primary:hover{background:#fff}.btn.secondary{border:1px solid #ffffff35;color:#e9e9ed;background:#ffffff08}.btn.secondary:hover{border-color:#ffffff8c}
.bottom{position:absolute;bottom:1.5rem;left:1.5rem;right:1.5rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;color:#70717a;font-size:.66rem;letter-spacing:.17em;z-index:2;opacity:0;animation:fade-up 1s 3.7s forwards}
@keyframes logo-reveal{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes headline-in{to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}@keyframes fade-up{from{opacity:0;transform:translateY(19px)}to{opacity:1;transform:translateY(0)}}@keyframes line-in{to{width:105px}}@keyframes aura{50%{transform:scale(1.18);opacity:.55}}@keyframes ring-in{to{opacity:1}}@keyframes sweep{to{transform:translateX(110%)}}
@media(max-width:600px){.stage{min-height:100svh}.logo-wrap{margin-bottom:.9rem}.divider{margin:1.4rem auto}.headline{margin-top:1.3rem}.bottom{font-size:.5rem;left:1rem;right:1rem;bottom:1rem}.sub{margin:1.5rem auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.logo-wrap,.brand,.eyebrow,.headline,.sub,.actions,.bottom,.ring{opacity:1;filter:none;transform:none}.divider{width:105px}}
</style>
</head>
<body>
<main class="stage" aria-label="Apple Space Coming Soon">
  <div class="aura" aria-hidden="true"></div><div class="ring" aria-hidden="true"></div><div class="ring two" aria-hidden="true"></div>
  <div class="content">
    <div class="logo-wrap"><img src="/applespace-logo.png" alt="Apple Space logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="logo-fallback">Apple Space</span></div>
    <div class="brand">Apple Space</div><div class="divider"></div>
    <div class="eyebrow">A NEW EXPERIENCE IS COMING</div>
    <h1 class="headline">COMING<br>SOON.</h1>
    <p class="sub">Something extraordinary is on its way.</p>
    <div class="actions"><a class="btn primary" href="/about/">Explore Apple Space &rarr;</a><a class="btn secondary" href="https://wa.me/923345136382" target="_blank" rel="noopener noreferrer">Contact on WhatsApp</a></div>
  </div>
  <footer class="bottom"><span>RAWALPINDI, PAKISTAN</span><span>THE NEXT CHAPTER STARTS HERE</span></footer>
</main>
</body>
</html>
